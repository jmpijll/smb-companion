[package]
name = "smb-lol"
version = "0.3.0"
edition = "2021"
description = "SMB Companion: the small companion app for SMB players. League of Legends: automatic runes and summoner spells in champion select, without getting in the way of your game."
license = "MIT"
repository = "https://github.com/jmpijll/smb-companion"
publish = false

[[bin]]
name = "smb-lol"
path = "src/main.rs"

[dependencies]
eframe = "0.33"
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tray-icon = "0.21"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
