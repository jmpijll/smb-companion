name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  INNO_VERSION: "6.7.4"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: ./packaging/install-inno.ps1 -Version $env:INNO_VERSION

      - name: Package installer and portable zip
        shell: pwsh
        run: ./packaging/package.ps1 -Iscc $env:ISCC

      - uses: actions/upload-artifact@v4
        with:
          name: smb-companion-${{ github.sha }}
          path: dist/*
          retention-days: 14
