name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tag -ne $version) { throw "Tag v$tag does not match Cargo.toml version $version" }

      - run: cargo test --locked
      - run: cargo build --locked --release

      - name: Package
        shell: pwsh
        run: |
          $name = "smb-lol-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/smb-lol.exe "dist/$name.exe"
          New-Item -ItemType Directory -Force "pkg/$name" | Out-Null
          Copy-Item target/release/smb-lol.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md "pkg/$name/"
          Compress-Archive -Path "pkg/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **Windows x64, portable.** Download the ``.exe`` and run it. No installer.

          This build is **not code-signed** yet, so SmartScreen will warn: choose *More info → Run anyway*.
          Check the file against ``SHA256SUMS.txt`` if you want to be sure.

          "@
          gh release create "${{ github.ref_name }}" dist/* `
            --title "SMB // League of Legends ${{ github.ref_name }}" `
            --notes $notes --generate-notes --verify-tag
