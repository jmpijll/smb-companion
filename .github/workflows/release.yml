name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  INNO_VERSION: "6.7.4"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tag -ne $version) { throw "Tag v$tag does not match Cargo.toml version $version" }

      - run: cargo test --locked
      - run: python -m unittest discover -s tools -p test_export_minecraft_channel.py
      - run: cargo build --locked --release

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: ./packaging/install-inno.ps1 -Version $env:INNO_VERSION

      - name: Package installer and portable zip
        shell: pwsh
        run: ./packaging/package.ps1 -Iscc $env:ISCC

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}"
          $notes = @"
          ### Downloads (Windows x64)

          | File | What it is |
          | --- | --- |
          | ``smb-companion-$v-setup.exe`` | **Installer.** Per-user, no admin rights. Start menu shortcut, optional *Start with Windows*, clean uninstall. |
          | ``smb-companion-$v-portable.zip`` | **Portable.** Unzip anywhere and run ``smb-lol.exe``. Settings stay in that folder. |

          Builds are **not code-signed** yet, so SmartScreen will warn: choose *More info → Run anyway*.
          Check the files against ``SHA256SUMS.txt`` if you want to be sure.

          "@
          gh release create $v dist/* --title "SMB Companion $v" --notes $notes --generate-notes --verify-tag
